name: Publish approved Oger Dock poster gallery
on:
  push:
    branches: [main]
    paths:
      - Oger-Dock-Posteres-Oficiais-README.zip

permissions:
  contents: write

concurrency:
  group: oger-gallery-import
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "718ef1a14b89a2a8803d01ca96195e3e4d6ba1113b442bd7de9b537a59ca3de2  Oger-Dock-Posteres-Oficiais-README.zip" | sha256sum -c -
          unzip -t Oger-Dock-Posteres-Oficiais-README.zip >/dev/null

      - name: Import images and update the two READMEs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          files = [
              ("01-ogermenu.webp", "OgerMenu", "Application menu", "Pesquise aplicativos, navegue pelas categorias e acesse ações de sessão.", "Find apps, browse categories and access session actions."),
              ("02-pastas-leque.webp", "Pastas em leque", "Fan folders", "Acesse aplicativos agrupados em coleções animadas.", "Open collections of shortcuts in an animated fan."),
              ("03-dolphin.webp", "Integração com Dolphin", "Dolphin integration", "Abra pastas diretamente no gerenciador de arquivos do KDE.", "Open folders directly in KDE's Dolphin file manager."),
              ("04-bandeja.webp", "Menus nativos da bandeja", "Native tray menus", "Use as ações SNI/DBusMenu de aplicativos compatíveis.", "Access SNI/DBusMenu actions from compatible applications."),
              ("05-lixeira.webp", "Popup da lixeira", "Trash popup", "Visualize itens, esvazie com confirmação e abra no Dolphin.", "View trash contents, empty with confirmation, or open in Dolphin."),
              ("06-miniplayer.webp", "Mini player MPRIS", "MPRIS mini player", "Controle a reprodução de mídia com informações integradas.", "Control compatible media players and view track information."),
              ("07-contexto.webp", "Menu de contexto", "Dock context menu", "Destrave, reorganize e configure rapidamente a dock.", "Unlock, arrange and configure the dock."),
              ("08-configuracoes.webp", "Painel de configurações", "Settings panel", "Configure lançadores, pastas, aparência e atalhos.", "Configure launchers, folders, appearance and shortcuts."),
          ]
          expected = {"Images/features/" + row[0] for row in files}
          expected.add("GALERIA-README.pt_BR.md")
          folder = Path("Images/features")
          folder.mkdir(parents=True, exist_ok=True)
          archive = Path("Oger-Dock-Posteres-Oficiais-README.zip")
          with ZipFile(archive) as z:
              names = z.namelist()
              if len(names) != 9 or set(names) != expected:
                  raise SystemExit("Unexpected files in the provided ZIP")
              for item in files:
                  name = "Images/features/" + item[0]
                  data = z.read(name)
                  if not (30000 < len(data) < 1000000 and data[:4] == b"RIFF" and data[8:12] == b"WEBP"):
                      raise SystemExit("Invalid WebP: " + name)
                  (folder / item[0]).write_bytes(data)

          def gallery(lang):
              if lang == "pt":
                  out = "## Galeria\n\n### Demonstração dos recursos\n\n"
                  out += "> **Montagens de apresentação:** imagens baseadas em capturas reais do Oger Dock. Nomes de arquivos e pastas pessoais foram substituídos por exemplos genéricos. A arte externa não é um tema instalável do aplicativo.\n\n"
              else:
                  out = "## Gallery\n\n### Feature demonstrations\n\n"
                  out += "> **Promotional composites:** images based on actual Oger Dock captures, with personal folders and filenames replaced by generic examples. The external artwork is not an installable dock theme.\n\n"
              for i, row in enumerate(files, 1):
                  filename, pt, en, pt_desc, en_desc = row
                  name = pt if lang == "pt" else en
                  desc = pt_desc if lang == "pt" else en_desc
                  out += f"### {i}. {name}\n\n"
                  out += f'<p align="center"><img src="Images/features/{filename}" width="100%" alt="Oger Dock — {name} (visual demonstration)" /></p>\n\n'
                  out += desc + "\n\n"
              return out

          for path, a, b, lang in [
              ("README.pt_BR.md", "## Galeria\n", "## Instalação\n", "pt"),
              ("README.md", "## Gallery\n", "## Installation\n", "en"),
          ]:
              f = Path(path)
              body = f.read_text(encoding="utf-8")
              if body.count(a) != 1 or body.count(b) != 1:
                  raise SystemExit("Missing or repeated README section: " + path)
              start = body.index(a)
              end = body.index(b, start + len(a))
              f.write_text(body[:start] + gallery(lang) + body[end:], encoding="utf-8")

          for old in ("ogermenu.svg", "fan-folders.svg", "dolphin.svg", "native-tray-menu.svg", "trash-popup.svg", "mini-player.svg", "context-menu.svg", "settings.svg"):
              (Path("Images/posters") / old).unlink(missing_ok=True)
          Path("docs/GALERIA-IMPORTACAO.pt_BR.md").write_text(
              "# Galeria oficial do Oger Dock\n\n"
              "Os dois READMEs exibem oito pôsteres WebP de 2048 × 1152 pixels, diretamente na página, na pasta Images/features/.\n\n"
              "São montagens de divulgação baseadas em capturas reais. Pastas, nomes pessoais e conteúdo da lixeira foram trocados por exemplos genéricos. A moldura artística não representa um tema instalável.\n\n"
              "Os antigos pôsteres ilustrativos SVG foram substituídos.\n", encoding="utf-8")
          archive.unlink()
          print("Installed eight WebP feature posters and updated both READMEs")
          PY

      - name: Commit approved gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "docs: replace temporary SVG posters with approved Oger Dock WebP gallery"
            git push origin HEAD:main
          fi
