name: Import Oger Dock 1.0.0 source from existing release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-oger-dock-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oger-dock-source-import
  cancel-in-progress: false

jobs:
  import:
    name: Publish complete source in Code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source ZIP from existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download 'lançamento' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Oger-Dock-1.0.0-Instalador.zip' \
            --dir "$RUNNER_TEMP"

      - name: Verify source identity and unpack
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Oger-Dock-1.0.0-Instalador.zip"
          printf '%s  %s\n' \
            '7ff48a115a16e64f149c24c385035d17a54c4378ba0bec2b9a6a8f1b9a0c8280' \
            "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/source"
          unzip -t "$archive" >/dev/null
          unzip -q "$archive" -d "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile
          source = Path(os.environ["RUNNER_TEMP"]) / "source" / "Oger-Dock-1.0.0-Instalador"
          archive = Path(os.environ["RUNNER_TEMP"]) / "Oger-Dock-1.0.0-Instalador.zip"
          with ZipFile(archive) as z:
              entries = z.namelist()
              assert len(entries) == 355, f"Unexpected file count: {len(entries)}"
              assert all(
                  item.startswith("Oger-Dock-1.0.0-Instalador/")
                  and ".." not in Path(item).parts
                  for item in entries
              ), "Unsafe or unrelated archive paths"
          for required in ("CMakeLists.txt", "src/CMakeLists.txt", "metadata.json",
                           "scripts-user/setup.sh", "LICENSE", "NOTICE"):
              assert (source / required).is_file(), f"Missing {required}"
          info = json.loads((source / "metadata.json").read_text())
          assert info["KPlugin"]["Id"] == "org.kde.plasma.punchi-dock-remastered"
          assert info["KPlugin"]["Name"] == "Oger Dock"
          assert info["KPlugin"]["Version"] == "1.0.0"
          print("Verified Oger Dock 1.0.0 / 355 archive members")
          PY

      - name: Copy application source, preserving published documentation
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/source/Oger-Dock-1.0.0-Instalador"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/README.pt_BR.md' \
            --exclude='/LICENSE' \
            --exclude='/NOTICE' \
            --exclude='/CHANGELOG.md' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/SECURITY.md' \
            --exclude='/CODE_OF_CONDUCT.md' \
            --exclude='/.editorconfig' \
            --exclude='/.gitattributes' \
            --exclude='/.gitignore' \
            --exclude='/Images/' \
            --exclude='/docs/' \
            "$source/" ./
          # ZIP archive did not carry executable bits for scripts.
          for folder in scripts-user scripts-dev; do
            if [ -d "$folder" ]; then
              find "$folder" -type f -name '*.sh' -exec chmod +x {} +
            fi
          done
          test -f src/CMakeLists.txt
          test -f contents/ui/main.qml
          test -f metadata.json
          test -f scripts-user/setup.sh

      - name: Commit source files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'release: publish complete Oger Dock 1.0.0 source tree'
          git push origin HEAD:main
