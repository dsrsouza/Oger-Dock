name: Feature request
description: Suggest a feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the workflow or problem before suggesting an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Mention any effects on KDE Plasma, existing settings, tray behavior or Wayland.
